<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a1d28" />
    <meta name="robots" content="noindex" />
    <title>Sem conexão | Cespedes Living</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: #0a1d28;
        color: #f6f6f1;
        font-family: "DM Sans", Arial, sans-serif;
        text-align: center;
      }
      main {
        max-width: 360px;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
      }
      h1 {
        margin: 24px 0 8px;
        font-family: "Playfair Display", Georgia, serif;
        font-weight: 400;
        font-size: 28px;
      }
      p {
        margin: 0 0 28px;
        color: #c9cfd2;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        padding: 14px 28px;
        border-radius: 999px;
        background: #c9a96a;
        color: #0a1d28;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid #f6f6f1;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logos/optimized/icon-192.png" alt="Cespedes Living" />
      <h1>Você está sem conexão</h1>
      <p>Confira sua internet e tente de novo para acessar sua conta.</p>
      <a href="/entrar">Tentar novamente</a>
    </main>
  </body>
</html>
